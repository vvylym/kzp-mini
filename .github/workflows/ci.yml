name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          cargo +1.91.0 install --git https://github.com/coral-xyz/anchor avm --tag v1.0.2 --locked --force
          avm install 1.0.2
          avm use 1.0.2
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build program
        run: |
          mkdir -p target/deploy
          cp -f keys/kzp_mini-keypair.json target/deploy/kzp_mini-keypair.json
          NO_DNA=1 anchor build --ignore-keys

      - name: Unit + integration tests
        run: cargo llvm-cov nextest --workspace --all-targets --all-features --summary-only

      - name: CLI smoke test
        run: cargo run -p kzp-cli -- config
