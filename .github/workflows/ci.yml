name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: rustfmt

      - run: cargo fmt --all -- --check

  build-program:
    name: Build kzp-mini (.so)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libudev-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-kzp-mini

      - name: Cache Anchor / avm
        uses: actions/cache@v4
        with:
          path: |
            ~/.avm
            ~/.cargo/bin/avm
            ~/.cargo/bin/anchor
          key: anchor-1.0.2-${{ runner.os }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor 1.0.2
        run: |
          if ! command -v avm >/dev/null; then
            rustup toolchain install 1.91.0 --profile minimal
            cargo +1.91.0 install --git https://github.com/coral-xyz/anchor avm --tag v1.0.2 --locked --force
          fi
          avm install 1.0.2
          avm use 1.0.2
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      - name: Build BPF artifact (ephemeral program id for CI)
        run: |
          mkdir -p target/deploy keys
          solana-keygen new -o keys/program.json --no-bip39-passphrase --force
          cp keys/program.json target/deploy/kzp_mini-keypair.json
          NO_DNA=1 anchor keys sync
          NO_DNA=1 anchor build --ignore-keys

      - name: Stage and upload build artifacts
        run: |
          mkdir -p ci-artifact
          cp target/deploy/kzp_mini.so ci-artifact/kzp_mini.so
          cp programs/kzp-mini/src/lib.rs ci-artifact/lib.rs

      - uses: actions/upload-artifact@v4
        with:
          name: kzp-mini-build
          path: ci-artifact
          retention-days: 7

  test:
    name: clippy + nextest
    needs: [build-program]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: clippy

      - uses: taiki-e/install-action@nextest

      - name: Download BPF artifact
        uses: actions/download-artifact@v4
        with:
          name: kzp-mini-build
          path: artifact

      - name: Restore CI-built program id + .so
        run: |
          mkdir -p target/deploy
          cp artifact/kzp_mini.so target/deploy/kzp_mini.so
          cp artifact/lib.rs programs/kzp-mini/src/lib.rs

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-kzp-mini

      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - run: cargo nextest run --workspace --all-targets --all-features
