[workspace]
members = [
    "cli",
    "programs/*",
    "tests",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/vvylym/kzp-mini"

[workspace.dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"
kzp-mini = { path = "programs/kzp-mini" }
solana-client = "3.1.12"
solana-program-test = { version = "3.1.12", features = ["agave-unstable-api"] }
solana-sdk = "3.0.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
